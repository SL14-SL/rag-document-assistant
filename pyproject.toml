[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-document-assistant"
version = "0.1.0"
description = "Local document assistant with source citations and evaluation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "openai>=2.54.0",
    "pydantic>=2.14.3",
    "pypdf>=6.21.4",
    "sentence-transformers>=6.2.0",
    "streamlit>=1.67.0",
    "torch>=2.15.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rag_document_assistant"]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
torch = { index = "pytorch" }
